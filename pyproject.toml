[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcroy-booker"
version = "2.1.0"
description = "Book an OPD slot at B.C. Roy Technology Hospital (IIT Kharagpur) the moment booking opens"
readme = "README.md"
license = "MIT"
# 3.11+: on Windows, time.sleep only became precise (high-resolution timers) in 3.11
requires-python = ">=3.11"
dependencies = ["playwright>=1.40", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bcroy-book = "bcroy_booker.cli:main"

[project.gui-scripts]
bcroy-booker = "bcroy_booker.gui:main"

[tool.setuptools]
packages = ["bcroy_booker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
