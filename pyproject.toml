[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kgp-opd"
version = "2.2.0"
description = "Book an OPD slot at B.C. Roy Technology Hospital (IIT Kharagpur) the moment booking opens"
readme = "README.md"
license = "MIT"
# 3.11+: on Windows, time.sleep only became precise (high-resolution timers) in 3.11
requires-python = ">=3.11"
dependencies = ["playwright>=1.40", "keyring>=24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kgp-opd = "kgp_opd.cli:main"

[project.gui-scripts]
kgp-opd-app = "kgp_opd.gui:main"

[tool.setuptools]
packages = ["kgp_opd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
